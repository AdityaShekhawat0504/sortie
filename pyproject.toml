[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sortie"
version = "0.1.0"
description = "Post-flight forensics for PX4 drone logs: rule checks, unsupervised anomaly scoring and a fault-injection benchmark that measures both."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Aditya Singh Shekhawat" }]
keywords = ["px4", "drone", "uav", "ulog", "flight-log", "anomaly-detection", "fault-injection"]
dependencies = [
    "pyulog>=1.0",
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.27", "python-multipart>=0.0.9"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]

[project.scripts]
sortie = "sortie.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
